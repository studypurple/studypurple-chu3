<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スタパー中２英単語">
<style>body{margin:0}</style>
</head><body>
<title>スタパー中２英単語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 中2 edition (NEW HORIZON English Course 2), made from the 中1 build (assets/chu1/build/mkapp.py) + assets/chu2/build/mkapp.py.
   Home = countdown to the next 定期テスト + today's quota. Words are grouped by textbook Unit; each word is one stone of the castle wall.
   Palette: the bright brand violet + energetic orange chosen for 中1. */
:root{
  --bg:#faf7ff; --surface:#ffffff; --surface2:#f3edff; --ink:#1d1533; --muted:#655a80; --line:#e9e1fa;
  --accent:#7c3aed; --accent-soft:#efe6ff; --on-accent:#ffffff;
  --cta:#ff8a1a; --on-cta:#ffffff; --cta-ink:#b55a00;
  --ok:#17845a; --ok-soft:#dcf2e7; --ng:#c93a32; --ng-soft:#fbe4e2;
  --s0:#e2dcef; --s1:#d4c2ff; --s2:#a782fb; --s3:#7c3aed; --sk:#ffa84d;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-en:"Sora","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1c1a28; --surface2:#252236; --ink:#eeecf6; --muted:#a39eb9; --line:#2f2c42;
  --accent:#b597ff; --accent-soft:#2f2357; --on-accent:#16112e;
  --cta:#ff9440; --on-cta:#2a1300; --cta-ink:#ffab66;
  --ok:#4fcf98; --ok-soft:#163629; --ng:#ff8a80; --ng-soft:#3a1d22;
  --s0:#2c2940; --s1:#43337f; --s2:#7656d6; --s3:#b597ff; --sk:#d98a45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1c1a28; --surface2:#252236; --ink:#eeecf6; --muted:#a39eb9; --line:#2f2c42;
  --accent:#b597ff; --accent-soft:#2f2357; --on-accent:#16112e;
  --cta:#ff9440; --on-cta:#2a1300; --cta-ink:#ffab66;
  --ok:#4fcf98; --ok-soft:#163629; --ng:#ff8a80; --ng-soft:#3a1d22;
  --s0:#2c2940; --s1:#43337f; --s2:#7656d6; --s3:#b597ff; --sk:#d98a45; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--f-en)}
.num{font-family:var(--f-en);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
small{font-size:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(13px,4vw,17px);letter-spacing:0;white-space:nowrap;min-width:0}
.brand img{width:34px;height:34px;object-fit:contain}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.12em;line-height:1}
.stats{display:flex;gap:6px}
.stat{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.stat svg{width:16px;height:16px}

/* countdown */
.count{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:18px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;position:relative;overflow:hidden}
.count .days{font-family:var(--f-en);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.03em;grid-row:span 2}
.count .days small{font-size:16px;font-family:var(--f-jp);font-weight:700;margin-left:2px;letter-spacing:0}
.count .lab{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.85}
.count .sub{font-size:13px;opacity:.9}
.count::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:22px solid currentColor;opacity:.08}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.quota{display:grid;gap:10px}
.qrow{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;font-size:14px}
.qrow b{font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--cta);border-radius:inherit;transition:width .5s}
.bar.v b{background:var(--accent)}
.hint{font-size:13px;color:var(--muted)}

.go{width:100%;border:0;border-radius:14px;background:var(--cta);color:var(--on-cta);font-weight:900;font-size:17px;padding:15px;box-shadow:0 4px 0 color-mix(in srgb,var(--cta) 60%,#000)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--cta) 60%,#000)}
.go:disabled{opacity:.45;cursor:default}
.go.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.go.ng{background:var(--ng);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ng) 60%,#000)}
.go2{width:100%;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:14px;font-weight:700;font-size:15px;padding:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.steps button{display:grid;gap:2px;align-content:center;line-height:1.35}
.steps small{font-family:var(--f-en);font-size:11px;letter-spacing:.14em;opacity:.8}
.steps .cnt{font-size:13px;font-weight:700;opacity:.85}
.ghost{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px}

.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:12px 14px;border:0;text-align:left;width:100%}
.banner img{width:52px;height:52px;object-fit:contain;flex:none}
.banner b{display:block;font-size:15px}
.banner span{font-size:13px;color:var(--muted)}

.sec{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.tile .big{font-family:var(--f-en);font-weight:700;font-size:22px;color:var(--ink);line-height:1.2}
.tile.boss{background:linear-gradient(135deg,var(--surface),var(--accent-soft))}
.tile.done{opacity:.7}

/* stone strip on home */
.strip{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--s0);gap:1px}
.strip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* map */
.letter{display:grid;grid-template-columns:4.2em 1fr;gap:8px;align-items:start}
.letter h3{font-family:var(--f-en);font-size:15px;line-height:1;padding-top:1px}
.letter h3 small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px}
.stones{display:flex;flex-wrap:wrap;gap:2px}
.stones button{width:11px;height:9px;border:0;border-radius:2px;padding:0;background:var(--s0)}
.stones button.l1{background:var(--s1)}.stones button.l2{background:var(--s2)}.stones button.l3{background:var(--s3)}
.stones button.hw{outline:1.5px solid var(--cta);outline-offset:-1.5px}

/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 30px rgba(0,0,0,.15);z-index:30;max-width:560px;margin:0 auto}
.sheet .w{display:flex;align-items:center;gap:10px}
.sheet .w b{font-family:var(--f-en);font-size:26px}
.shade{position:fixed;inset:0;background:rgba(10,8,20,.35);z-index:29;border:0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;border:0;background:none;padding:8px 4px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current]{color:var(--accent)}

/* words list */
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.wr .t{min-width:0;border:0;background:none;text-align:left;padding:0}
.ptag{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-right:6px}
.wtools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;gap:8px;padding-block:6px;margin-top:-6px}
.postabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface2);border-radius:12px;padding:4px}
.postabs::-webkit-scrollbar{display:none}
.postabs button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px;color:var(--muted);display:grid;justify-items:center;line-height:1.25}
.postabs button small{font-size:10px;font-weight:500}
.postabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.az{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.az::-webkit-scrollbar{display:none}
.az button{flex:none;border:0;background:none;font-family:var(--f-en);font-weight:600;font-size:13px;color:var(--accent);min-width:26px;padding:0 6px!important;height:26px;border-radius:6px;padding:0}
.az button:active{background:var(--accent-soft)}
.lh{font-family:var(--f-en);font-size:18px;padding:14px 0 4px;border-bottom:2px solid var(--accent);display:flex;align-items:baseline;gap:8px}
.lh small{font-size:11px;color:var(--muted);font-weight:500}
.wr .t b{font-family:var(--f-en);font-size:16px;font-weight:600}
.wr .t span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.wr .no{font-size:11px;color:var(--muted);font-family:var(--f-en)}
.lv{width:10px;height:10px;border-radius:3px;background:var(--s0)}
.lv.l1{background:var(--s1)}.lv.l2{background:var(--s2)}.lv.l3{background:var(--s3)}
.spk{border:0;background:var(--accent-soft);color:var(--accent);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px}
.spk.l{width:52px;height:52px}.spk.l svg{width:28px;height:28px}

/* settings */
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.units{display:flex;flex-wrap:wrap;gap:6px}
.upick summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}
.upick summary::-webkit-details-marker{display:none}
.upick .uh{display:grid;gap:2px;min-width:0}.upick .uh b{font-size:13px;color:var(--muted)}
.upick .cur{font-weight:900;font-size:16px;color:var(--accent)}
.upick .chg{flex:none;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px}
.upick[open] .chg{background:var(--accent);color:#fff}
.upick[open] summary{margin-bottom:10px}
.upick .ufoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.upick .ufoot .ghost{margin:0;width:auto;padding:6px 12px}
.units label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.units label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.units input,.field .units input{accent-color:var(--accent);margin:0;width:auto;padding:0}
.field .units label{font-size:13px}
.senses{display:grid;gap:4px}
.senses div{display:flex;gap:8px;align-items:baseline}
.senses .pos{flex:none}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.uhead small{color:var(--muted);font-weight:500}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.range input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.teacher{border:2px dashed var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.teacher h2{font-size:16px}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 140px)}
.lt{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:4px 6px}
.lt .bar{flex:1}
.lt .meta{font-size:13px;font-weight:700;color:var(--cta-ink);min-width:4.5em;text-align:right}
.q{display:flex;flex-direction:column;gap:14px;flex:1}
.ask{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.prompt{display:flex;align-items:center;gap:12px;min-height:72px}
.prompt .big{font-size:34px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.prompt .big.jp{font-family:var(--f-jp);font-size:24px}
.prompt .exs{font-family:var(--f-en);font-size:19px;line-height:1.5}
.blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-size:16px;font-weight:700;min-height:52px}
.opt.en{font-family:var(--f-en);font-weight:600;font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--ng);background:var(--ng-soft)}
.typein{font-family:var(--f-en);font-size:24px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;text-align:center}
.boxes{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.boxes i{width:22px;height:30px;border-bottom:3px solid var(--line);font-family:var(--f-en);font-style:normal;font-size:20px;text-align:center;font-weight:600}
.boxes i.on{border-color:var(--accent);color:var(--accent)}
.boxes i.sp{border:0;width:10px}
.learn{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.learn .w{display:flex;align-items:center;gap:12px}
.learn .w b{font-family:var(--f-en);font-size:34px;font-weight:700;overflow-wrap:anywhere}
.learn .pos{display:inline-block;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;margin-right:6px}
.learn .ja{font-size:18px;font-weight:700}
.ex{font-family:var(--f-en);font-size:15px;background:var(--surface2);border-radius:10px;padding:8px 12px}
.ex mark{background:none;color:var(--accent);font-weight:700}
.new{font-size:12px;font-weight:900;color:var(--cta-ink);letter-spacing:.12em}
.bottom{border-radius:16px;padding:14px;display:grid;gap:12px}
/* the result panel sits on the bottom of the screen, so つぎへ is always under the thumb without scrolling */
.lesson .bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 24px rgba(0,0,0,.14);max-height:62vh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30%);opacity:.4}}
.lesson.fbopen{padding-bottom:240px}
.bottom.ok{background:var(--ok-soft)}
.bottom.ng{background:var(--ng-soft)}
.fbrow{display:flex;gap:12px;align-items:flex-start}
.fbrow img{width:52px;height:52px;object-fit:contain;flex:none}
.fb{display:grid;gap:4px;min-width:0}
.fb b{font-size:16px}
.ok .fb b{color:var(--ok)}.ng .fb b{color:var(--ng)}
.ans{font-weight:700;overflow-wrap:anywhere}
.mine .bad{color:var(--ng);text-decoration:underline}

/* time attack / boss */
.ta{font-family:var(--f-en);font-weight:700;font-size:40px;text-align:center;line-height:1}
.hp{display:grid;gap:4px}
.hp .bar b{background:var(--ng)}
.hearts{font-size:18px;letter-spacing:2px;color:var(--ng)}
.bossart{display:flex;justify-content:center}
.bossart svg{width:120px;height:90px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
.res{display:flex;flex-direction:column;gap:14px;text-align:center;padding-top:8px}
.res h1{font-size:28px;font-weight:900}
.res img.p{width:110px;height:110px;object-fit:contain;margin:0 auto}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.rbox small{display:block;color:var(--muted)}
.rbox b{font-family:var(--f-en);font-size:24px}
.miss{text-align:left}
.miss div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.miss .en{font-weight:600}
.grow{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:12px;padding:10px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#fx i{position:absolute;color:var(--cta);font-style:normal;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-12px) scale(1.06)}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.confirm{background:var(--ng-soft);border-radius:12px;padding:12px;display:grid;gap:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"><div class="loading">単語データを読みこんでいます…</div></div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* calendar days as integers (local time) */
const dayNum = d => { d = d || new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()))/86400000); };
const TODAY = () => dayNum();

function typeFor(w){
  const b = box(w.no), single = !/\s/.test(w.t) && w.t.length <= 12;
  if (b <= 1) return 'ej';
  if (b === 2) return pick(w.blank ? ['je','cloze'] : ['je']);
  return single ? pick(['spell','spell', w.blank ? 'cloze' : 'je']) : pick(['je', w.blank ? 'cloze' : 'ej']);
}
function makeQ(w, type){
  type = type || typeFor(w);
  const q = {w, type, retry:false};
  if (type==='ej' || type==='listen') { q.opts = shuffle([w.q, ...distract(w, W, 'ja', 3)]); q.correct = w.q; }
  else if (type==='je') { q.opts = shuffle([w.t, ...distract(w, W, 't', 3)]); q.correct = w.t; }
  else if (type==='cloze') { const cw = {...w, t:w.blank}; q.opts = shuffle([w.blank, ...distract(w, W, 't', 3)]); q.correct = w.blank; }
  else if (type==='spell') { q.target = w.t; q.input = ''; q.hints = 0; }
  return q;
}
function makePQ(p){
  const type = (S.pr[p.id] && S.pr[p.id][0] >= 2) ? 'pje' : 'pej';
  const q = {p, type, retry:false};
  if (type==='pej'){ q.opts = shuffle([p.q, ...distract(p, P, 'ja', 3)]); q.correct = p.q; }
  else { q.opts = shuffle([p.t, ...distract(p, P, 't', 3)]); q.correct = p.t; }
  return q;
}

/* words not started yet, in the order they are introduced: ones already looked at on the 覚える screen, then homework range, then the mixed order */
function freshList(){
  const seen = Object.keys(S.seen||{}).map(Number).filter(no => box(no) < 0 && BYNO[no]).sort((a,b)=>S.seen[a]-S.seen[b]).map(no => BYNO[no]);
  const hwFirst = hwWords().filter(w => box(w.no) < 0 && !seen.includes(w));
  return [...seen, ...hwFirst, ...ORDER.filter(w => box(w.no) < 0 && !seen.includes(w) && !hwFirst.includes(w))].filter(inRng);
}
const learnCount = () => 10;
function buildStudy(mode){
  rollDay();
  const pl = plan();
  const due = shuffle(W.filter(w => isDue(w.no) && inRng(w))).sort((a,b) => rec(b.no)[2] - rec(a.no)[2] || rec(a.no)[1] - rec(b.no)[1]);
  const wantNew = Math.max(0, pl.newPer - S.dNew);
  const fresh = freshList();
  /* about 1 new word per 2 reviews; when nothing is due, all new */
  const N = mode==='quick' ? 40 : 10;
  const nNew = Math.min(fresh.length, due.length ? Math.max(Math.min(wantNew, Math.ceil(N/3)), N - due.length) : N);
  const picks = [...due.slice(0, N - nNew), ...fresh.slice(0, nNew)];
  if (!picks.length) return [];
  const qs = [];
  for (const w of shuffle(picks)) qs.push(makeQ(w, box(w.no) < 0 ? 'ej' : undefined));
  return qs;
}
function startLesson(kind, mode){
  let qs = [], extra = {};
  if (kind==='study') qs = buildStudy(mode);
  else if (kind==='learn') qs = freshList().slice(0, learnCount()).map(w => ({w, type:'card'}));
  else if (kind==='diag'){
    const el = shuffle(W.filter(w=>w.el)).slice(0,8), ot = shuffle(W.filter(w=>!w.el)).slice(0,22);
    qs = shuffle([...el, ...ot]).map(w => ({...makeQ(w,'ej'), diag:true}));
  }
  else if (kind==='phr'){
    const inScope = p => S.hw ? (!S.hw.units || !S.hw.units.length || S.hw.units.includes(p.u)) : inRng(p);
    const PS = P.some(inScope) ? P.filter(inScope) : P;
    const due = PS.filter(p => S.pr[p.id] && S.pr[p.id][1] <= TODAY()), fresh = PS.filter(p => !S.pr[p.id]);
    qs = [...shuffle(due).slice(0,6), ...fresh.slice(0, 10 - Math.min(6,due.length))].map(makePQ);
    qs = shuffle(qs);
  }
  else if (kind==='forms'){
    const fw = W.filter(w => w.forms && w.fparts);
    const weakFirst = shuffle(fw).sort((a,b)=>(S.fc[b.no]||0)-(S.fc[a.no]||0)).slice(0,10);
    qs = weakFirst.map(w => { const k = 1 + Math.floor(Math.random()*(w.fparts.length-1)); return {w, type:'form', k, input:'', target:w.fparts[k]}; });

  else if (kind==='ta'){ const deck = taDeck(); extra = {end: Date.now()+60000, score:0, deck}; qs = [makeQ(deck.pop(), 'ej')]; }
  else if (kind==='boss'){
    const wk = weekId(), from = wk*7 - 3;
    let pool = W.filter(w => rec(w.no) && rec(w.no)[3] >= from);
    if (pool.length < 12) pool = W.filter(w => box(w.no) >= 1);
    if (pool.length < 4) pool = ORDER.slice(0, 40);
    qs = shuffle(pool).slice(0,15).map(w => makeQ(w, pick(['ej','je', w.blank?'cloze':'ej'])));
    extra = {hp:qs.length, maxhp:qs.length, hearts:5};
  }
  if (!qs.length){ toastHome(S.rng && S.rng.length && (kind==='learn' || kind==='study') ? (kind==='learn' ? '選んだUnitの単語は、もう全部覚えはじめています。STEP 2のテストか、ほかのUnitを選んでみよう！' : '選んだUnitの今日の分は終わりました。ほかのUnitも選んでみよう！') : '今日の分は終わっています。タイムアタックや熟語に挑戦してみよう！'); return; }
  new Set(qs.map(q => ((q.w||q.p||{}).t||'')[0])).forEach(loadAud);
  L = {kind, mode, qs, i:0, first:0, total:0, xp:0, combo:0, miss:[], sel:null, checked:false, res:null, msg:'', start:Date.now(), rankBefore:rankOf(S.xp), ...extra};
  if (mode==='quick') L.end = Date.now() + 5*60000;

}
let timer = null;
function tick(){ clearInterval(timer); timer = setInterval(() => { if (!L || !L.end){ clearInterval(timer); return; }
  const el = document.getElementById('clock'); const left = Math.max(0, L.end - Date.now());
  if (el) el.textContent = L.kind==='ta' ? Math.ceil(left/1000) : `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;
  if (left <= 0 && L.kind==='ta'){ clearInterval(timer); finish(); } }, 250); }
/* one shuffled deck per round, so no word comes up twice: words already studied first, then the rest of the words */
function taDeck(){
  const learned = shuffle(W.filter(w => box(w.no) >= 1)), rest = shuffle(W.filter(w => box(w.no) < 1));
  const first = learned.length >= 30 ? learned : shuffle([...learned, ...rest.splice(0, 60)]);

function taQ(){ if (!L.deck.length) L.deck = taDeck(); return makeQ(L.deck.pop(), 'ej'); }
const PRAISE = ['すごい！','ナイス！','その調子！','完ぺき！','いいね！','さすが！'];

function formLabel(w, k){ const verb = /動/.test(w.pos) && !/^(good|bad|well|many|much|little)/i.test(w.fparts[0]); return verb ? (w.fparts.length===3 ? ['','過去形','過去分詞'][k] : ['','過去形'][k] || '変化形') : ['','比較級','最上級'][k]; }

function grade(q, ok){

  if (q.type==='form'){ S.fc[q.w.no] = ok ? Math.max(0,(S.fc[q.w.no]||0)-1) : (S.fc[q.w.no]||0)+2; return; }

      <button class="go" data-act="study" data-v="normal">テストする（10問）</button><button class="go2" data-act="learn">もう一度見る</button><button class="ghost" data-act="home">ホームにもどる</button></div>`; return; }
  if (k==='ta'){ const best = L.score > S.ta; if (best) S.ta = L.score; L.xp = L.score*3; title = best ? '自己ベスト更新！' : 'タイムアップ！';
    extra = `<div class="rgrid"><div class="rbox"><small>正解</small><b>${L.score}</b></div><div class="rbox"><small>自己ベスト</small><b>${S.ta}</b></div><div class="rbox"><small>獲得XP</small><b>+${L.xp}</b></div></div>`; }
  else if (k==='boss'){ const win = L.hp===0; if (win){ S.boss[weekId()] = true; L.xp += 100; } title = win ? 'ボス撃破！' : 'ボスに負けた…';
    extra = `<p>${win ? 'ボーナス +100XP。来週また新しいボスが来ます。' : 'まちがえた単語を復習して、もう一度挑戦しよう。'}</p>`; }
  else if (k==='diag'){ const el = L.qs.filter(q=>q.w.el && !q.retry), ot = L.qs.filter(q=>!q.w.el && !q.retry);
    const r1 = el.filter(q=>rec(q.w.no)).length/Math.max(1,el.length), r2 = ot.filter(q=>rec(q.w.no)).length/Math.max(1,ot.length);
    const est = Math.round(r1*W.filter(w=>w.el).length + r2*W.filter(w=>!w.el).length);
    S.diag = {est, r1, r2, day:t}; title = '診断テスト完了';
    extra = `<div class="rgrid"><div class="rbox"><small>推定の語い数</small><b>${est}</b></div><div class="rbox"><small>小学校の語</small><b>${Math.round(r1*100)}%</b></div><div class="rbox"><small>中学の語</small><b>${Math.round(r2*100)}%</b></div></div>
      <p>正解した単語は「定着中」になり、1〜2週間後に確認で出ます。</p>
      ${r1 >= .75 ? `<button class="go2" data-act="markel">小学校で習った${W.filter(w=>w.el).length}語も「定着中」にする</button>` : ''}`; }
  if (L.miss.length===0 && L.total >= 8 && k!=='ta' && k!=='diag'){ L.xp += 20; extra += '<p class="grow">ノーミスボーナス +20XP</p>'; }
  S.xp += L.xp;
  setTimeout(() => sendReport(true), 300);
  if (S.last !== t){ S.streak = (S.last >= 0 && t - S.last === 1) ? S.streak+1 : 1; S.last = t; }
  save();
  const rankUp = rankOf(S.xp) > L.rankBefore;
  sfx('clear');
  const acc = L.total ? Math.round(100*L.first/L.total) : 0;
  $app.innerHTML = `<div class="res"><img class="p hop" src="${PAPURU}" alt="ぱぷる"><h1>${title}</h1>
    ${rankUp?`<p class="grow">ランクアップ！「${esc(RANKS[rankOf(S.xp)][1])}」になった！</p>`:''}
    ${extra || `<div class="rgrid"><div class="rbox"><small>獲得XP</small><b>+${L.xp}</b></div><div class="rbox"><small>正答率</small><b>${acc}%</b></div><div class="rbox"><small>連続日数</small><b>${S.streak}</b></div></div>`}
    ${L.miss.length && k!=='diag' ? `<div class="miss"><h2 class="sec">まちがえた単語（明日の復習で出ます）</h2>${L.miss.map(w=>`<div><span class="en">${esc(w.en)}</span><span>${esc(w.q)}</span></div>`).join('')}</div>` : ''}
    <button class="go" data-act="home">ホームにもどる</button></div>`;
  L = null;
}
let toast = '';
function toastHome(msg){ toast = msg; tab = 'home'; render(); }

/* ---- events ---- */
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a==='tab'){ if (L) return; tab = v; SHEET = null; CONF = null; render(); }
  else if (a==='say') say(v);
  else if (a==='study') startLesson('study', v);
  else if (['diag','phr','forms','ta','boss'].includes(a)) startLesson(a);
  else if (a==='home'){ L = null; tab = 'home'; render(); }
  else if (a==='quit'){ clearInterval(timer); L = null; render(); }
  /* one tap answers; for English answers, read the correct one aloud just after the result sound */
  else if (a==='pick' && L && !L.checked){ const q = L.qs[L.i]; L.sel = v; check(); if (q.type==='je'||q.type==='cloze'||q.type==='pje') setTimeout(()=>say(q.correct), 450); }
  else if (a==='dontknow' && L && !L.checked){ L.sel = '__'; check(); }
  else if (a==='tapq' && L) tapQ(v);
  else if (a==='hint'){ const q = L.qs[L.i]; q.input = (document.getElementById('ans')||{}).value || q.input; q.hints = Math.min((q.hints||0)+1, q.target.length); lesson(); }
  else if (a==='check') check();
  else if (a==='next') next();
  else if (a==='prev' && L && L.i > 0){ L.i--; lesson(); }
  else if (a==='learn') startLesson('learn');
  else if (a==='stone'){ SHEET = +v; render(false); }
  else if (a==='closesheet'){ SHEET = null; render(false); }
  else if (a==='wf'){ wf = v; wlimit = 300; render(); }
  else if (a==='rngall'){ S.rng = []; save(); upOpen = true; render(false); }
  else if (a==='wsort'){ wsort = v; S.wsort = v; save(); wlimit = 300; render(); }
  else if (a==='wpos'){ wpos = v; wlimit = 300; render(); }
  else if (a==='wmore'){ wlimit += 300; fillWords(); }
  else if (a==='jump') jumpTo(v);
  else if (a==='oksnd'){ S.okSnd = v; save(); const was = S.mute; S.mute = false; sfx('ok', 0); S.mute = was; render(false); }
  else if (a==='sndtest'){ [0,1,2,3,4,5].forEach((c,i)=>setTimeout(()=>sfx('ok', c), i*700)); }
  else if (a==='saytest'){ SAYSTATE = '…'; say('Good morning. Nice to meet you.'); const el = document.getElementById('saystate'); if (el) el.textContent = '再生中…'; setTimeout(()=>{ const el2 = document.getElementById('saystate'); if (el2) el2.textContent = SAYSTATE || '反応がありません'; }, 2600); }
  else if (a==='mute'){ S.mute = !S.mute; save(); if (!S.mute) sfx('ok',0); render(false); }
  else if (a==='hwset'){ const units = checkedUnits('hwu'), due = document.getElementById('hwdue').value;
    const pos = document.getElementById('hwpos').value, order = document.getElementById('hworder').value;
    S.hw = {units, pos, order, due, seed: Math.floor(Math.random()*2e9)+1}; HWC = null;
    if (!hwWords().length){ S.hw = null; HWC = null; document.getElementById('hwmsg').textContent = 'その条件に入る単語がありません。'; } else { save(); render(false); } }
  else if (a==='hwlink'){ const url = hwLink(S.hw); const m = document.getElementById('hwlinkmsg');
    const done = () => { if (m) m.textContent = 'コピーしました。LINEやClassroomに貼って送ってください：' + url; };
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(done).catch(() => { if (m) m.textContent = 'このリンクを送ってください：' + url; }); }
  else if (a==='repset'){ const num = document.getElementById('repnum').value.trim(), nick = document.getElementById('repnick').value.trim(), code = document.getElementById('repcode').value.trim().toUpperCase();
    const m = document.getElementById('repmsg');
    if (!num || !nick || !code){ m.textContent = '出席番号・ニックネーム・クラスコードをすべて入れてください。'; return; }
    S.rep = {num, nick, code}; save(); sendReport(true); render(false); const m2 = document.getElementById('repmsg'); if (m2) m2.textContent = `登録しました。${num}番 ${nick} として先生に記録が届きます。`; }
  else if (a==='gorep'){ tab = 'set'; render(); const el = document.getElementById('repsec'); if (el) el.scrollIntoView({block:'start'}); }
  else if (a==='repoff'){ S.rep = null; save(); render(false); }
  else if (a==='joinlink'){ const code = document.getElementById('jcode').value.trim().toUpperCase(); const m = document.getElementById('joinmsg');
    if (!code){ m.textContent = 'クラスコードを入れてください。'; return; }
    const url = location.origin + location.pathname + '#class=' + encodeURIComponent(code);
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { m.textContent = 'コピーしました：' + url; }).catch(() => { m.textContent = 'このリンクを送ってください：' + url; }); }
  else if (a==='hwclear'){ S.hw = null; save(); render(false); }
  else if (a==='reset'){ CONF = 'reset'; render(false); }
  else if (a==='resetno'){ CONF = null; render(false); }
  else if (a==='resetyes'){ S = JSON.parse(JSON.stringify(DEF)); rollDay(); save(); CONF = null; tab = 'home'; render(); }
  else if (a==='markel'){ const t = TODAY(); W.filter(w=>w.el && !rec(w.no)).forEach((w,i)=>{ S.r[w.no] = [3, t + 7 + (i%14), 0, t]; }); save(); b.textContent = W.filter(w=>w.el).length + '語を「定着中」にしました'; b.disabled = true; }
});
$app.addEventListener('input', e => {
  if (e.target.id==='ans' && L){ L.qs[L.i].input = e.target.value; const btn = document.querySelector('[data-act=check]'); if (btn) btn.disabled = !e.target.value.trim(); }
  if (e.target.id==='wsearch'){ wq = e.target.value; clearTimeout(window._ws); window._ws = setTimeout(()=>{ wlimit = 300; fillWords(); }, 200); }
});
$app.addEventListener('change', e => {
  if (e.target.id==='voicesel'){ S.voice = e.target.value; save(); pickVoice(); say('Good morning'); }
  if (e.target.id==='exam' && (e.target.value === '' || parseDate(e.target.value) != null)){ S.exam = e.target.value; save(); }
  if (e.target.name==='rng'){ S.rng = checkedUnits('rng'); save(); if (tab==='home'){ upOpen = true; render(false); } }
});
$app.addEventListener('keydown', e => {
  if (e.key!=='Enter' || !L || e.isComposing) return;
  const q = L.qs[L.i];
  if (e.target.id==='ans'){ e.preventDefault(); if (!L.checked && q.input.trim()) check(); else if (L.checked) next(); }
});
function render(top=true){
  if (L) return lesson();
  if (tab==='map') mapTab(); else if (tab==='words') wordsTab(); else if (tab==='set') setTab(); else home();
  if (toast && tab==='home'){ const p = document.createElement('p'); p.className = 'grow'; p.textContent = toast; $app.insertBefore(p, $app.children[1]); toast = ''; }
  if (top) window.scrollTo(0,0);
}

/* ---- data ---- */
/* homework travels as a link: #hw=from.to.pos.order.due.seed — the seed keeps one shared random order for the whole class */
const SITE = !/claude|anthropic/i.test(location.hostname);
function hwLink(h){ return location.origin + location.pathname + '#hw=' + [(h.units||[]).join('-') || 'all', encodeURIComponent(h.pos||'all'), h.order||'no', h.due||'', h.seed||1].join('.'); }
function hwFromHash(){
  const jc = location.hash.match(/class=([^&]+)/);
  if (jc){ S.joinCode = decodeURIComponent(jc[1]).toUpperCase(); save(); if (!S.rep){ tab = 'set'; window._goRep = true; } try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  const m = location.hash.match(/hw=([^&]+)/); if (!m) return;
  const [us, pos, order, due, seed] = m[1].split('.'); const h = {units:(us && us!=='all') ? us.split('-').filter(k=>UNAME[k]) : [], pos:decodeURIComponent(pos||'all'), order:order==='rand'?'rand':'no', due:due||'', seed:+seed||1};
  if (HWPOS.some(x=>x[0]===h.pos)){ S.hw = h; HWC = null; save(); toast = '先生から宿題が届きました：' + hwDesc(h); tab = 'home'; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
}
function seeded(n){ let s = n; return () => (s = (s*1103515245 + 12345) % 2147483648) / 2147483648; }
fetch('nh2.json').then(r => r.json()).then(d => {
  UNITS = d.units; UNITS.forEach(u => { UNAME[u.key] = {name: u.name, short: unitShort(u)}; });
  const UORD = {}; UNITS.forEach((u,i) => UORD[u.key] = i);
  W = d.w.map(x => {
    const w = {...x, ex:'', blank:'', el:!!x.el, phr:[]};
    if (w.forms){ const fp = w.forms.split(/\s+-\s+/); w.fparts = fp; w.falt = w.fa || fp.map(s => [s.toLowerCase()]); }
    return w; });
  W.sort((a,b) => UORD[a.u]-UORD[b.u] || a.pg-b.pg || a.en.localeCompare(b.en));
  W.forEach(w => BYNO[w.no] = w);
  P = d.p.map(x => ({...x, id:'p'+x.no, ja:x.ja, pos:''}));
  const BYEN = {}; W.forEach(w => { if (!BYEN[w.en]) BYEN[w.en] = w; });
  P.forEach(p => { if (BYEN[p.head]) BYEN[p.head].phr.push(p); });
  P.sort((a,b) => UORD[a.u]-UORD[b.u] || a.pg-b.pg);
  /* new words come in textbook order (Unit, then page) */
  ORDER = W.slice();
  if (S.wsort==='abc') wsort = 'abc';
  hwFromHash();
  render();
  if (window._goRep){ const el = document.getElementById('repsec'); if (el) el.scrollIntoView({block:'start'}); }
  sendReport(false);
  addEventListener('hashchange', () => { if (/hw=|class=/.test(location.hash)){ hwFromHash(); L = null; render(); } });
}).catch(() => { $app.innerHTML = '<div class="loading">単語データを読みこめませんでした。ページを再読みこみしてください。</div>'; });
</script>
